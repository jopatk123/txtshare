services:
  text-share:
    build: .
    container_name: text-share
    restart: unless-stopped
    ports:
      - "6006:6006"
    volumes:
      # 数据库持久化
      - ./data/db:/app/src/server/db/data
      # 日志持久化（可选）
      - ./data/logs:/app/src/server/logs
    environment:
      - NODE_ENV=production
      - PORT=6006
      # 可选：设置对外访问的完整地址，例如 https://your-domain.example
      - BASE_URL=${BASE_URL:-}
      # 管理员令牌（必须设置才能启用 /admin/ 后台）
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
