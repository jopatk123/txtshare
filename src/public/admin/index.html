<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台 - TextShare</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --primary: #4a90d9;
      --primary-hover: #357abd;
      --danger: #ff4d4f;
      --danger-hover: #d9363e;
      --warning: #faad14;
      --success: #52c41a;
      --text: #333;
      --text-secondary: #666;
      --text-muted: #999;
      --border: #e8e8e8;
      --bg: #f5f7fa;
      --card: #fff;
      --shadow: 0 2px 12px rgba(0,0,0,.1);
      --radius: 8px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ── Login ── */
    #loginScreen {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 20px;
    }
    .login-card {
      background: var(--card); border-radius: 12px; box-shadow: var(--shadow);
      padding: 40px; width: 100%; max-width: 380px; text-align: center;
    }
    .login-card h1 { font-size: 22px; margin-bottom: 8px; }
    .login-card p  { color: var(--text-secondary); margin-bottom: 28px; font-size: 14px; }
    .login-card .note { color: var(--text-muted); margin: 10px 0 0; font-size: 12px; line-height: 1.5; }
    .login-card input {
      width: 100%; padding: 10px 14px; border: 1px solid var(--border);
      border-radius: var(--radius); font-size: 15px; outline: none;
      transition: border-color .2s;
    }
    .login-card input:focus { border-color: var(--primary); }
    .login-card button {
      width: 100%; margin-top: 14px; padding: 11px;
      background: var(--primary); color: #fff; border: none;
      border-radius: var(--radius); font-size: 15px; cursor: pointer;
      transition: background .2s;
    }
    .login-card button:hover { background: var(--primary-hover); }
    #loginError { color: var(--danger); font-size: 13px; margin-top: 10px; min-height: 18px; }

    /* ── Layout ── */
    #adminApp { display: none; min-height: 100vh; }
    .topbar {
      background: var(--card); border-bottom: 1px solid var(--border);
      padding: 0 24px; height: 52px; display: flex; align-items: center;
      justify-content: space-between; position: sticky; top: 0; z-index: 100;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    .topbar h1 { font-size: 17px; display: flex; align-items: center; gap: 8px; }
    .topbar-actions { display: flex; gap: 10px; align-items: center; }
    .main-content { padding: 24px; max-width: 1200px; margin: 0 auto; }

    /* ── Stats ── */
    .stats-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 14px; margin-bottom: 22px;
    }
    .stat-card {
      background: var(--card); border-radius: var(--radius); padding: 18px 20px;
      box-shadow: var(--shadow);
    }
    .stat-card .stat-label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
    .stat-card .stat-value { font-size: 26px; font-weight: 700; color: var(--text); }
    .stat-card .stat-value.expired { color: var(--danger); }
    .stat-card .stat-value.views   { color: var(--primary); }

    /* ── Toolbar ── */
    .toolbar {
      display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .toolbar input[type=search] {
      flex: 1; min-width: 180px; max-width: 320px;
      padding: 8px 12px; border: 1px solid var(--border);
      border-radius: var(--radius); font-size: 14px; outline: none;
    }
    .toolbar input[type=search]:focus { border-color: var(--primary); }
    .toolbar-right { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }

    /* ── Buttons ── */
    .btn {
      padding: 7px 14px; border: none; border-radius: var(--radius);
      font-size: 13px; cursor: pointer; transition: background .2s, opacity .2s;
      white-space: nowrap;
    }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-primary   { background: var(--primary);  color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
    .btn-danger    { background: var(--danger);   color: #fff; }
    .btn-danger:hover:not(:disabled)  { background: var(--danger-hover); }
    .btn-default   { background: #fff; color: var(--text); border: 1px solid var(--border); }
    .btn-default:hover:not(:disabled) { background: var(--bg); }
    .btn-warning   { background: var(--warning);  color: #fff; }
    .btn-warning:hover:not(:disabled) { background: #d48806; }
    .btn-sm { padding: 4px 10px; font-size: 12px; }

    /* ── Table ── */
    .table-wrap {
      background: var(--card); border-radius: var(--radius);
      box-shadow: var(--shadow); overflow: hidden;
    }
    .audit-wrap {
      margin-top: 18px; background: var(--card); border-radius: var(--radius);
      box-shadow: var(--shadow); overflow: hidden;
    }
    .audit-wrap h2 {
      padding: 16px 18px; font-size: 15px; border-bottom: 1px solid var(--border);
    }
    .audit-row td { font-size: 12px; color: var(--text-secondary); }
    .audit-detail {
      max-width: 320px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead th {
      background: #fafafa; padding: 11px 14px;
      text-align: left; font-weight: 600; color: var(--text-secondary);
      border-bottom: 1px solid var(--border); white-space: nowrap;
    }
    thead th:first-child { width: 36px; }
    tbody tr { border-bottom: 1px solid #f0f0f0; transition: background .15s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #fafbff; }
    tbody td { padding: 10px 14px; vertical-align: middle; }
    .id-cell { font-family: monospace; font-size: 12px; }
    .id-cell a { color: var(--primary); text-decoration: none; }
    .id-cell a:hover { text-decoration: underline; }
    .preview-cell { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-secondary); }
    .time-cell { white-space: nowrap; font-size: 12px; color: var(--text-muted); }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 10px;
      font-size: 11px; font-weight: 500;
    }
    .badge-expired { background: #fff2f0; color: var(--danger); }
    .badge-active  { background: #f6ffed; color: var(--success); }
    .badge-never   { background: #e6f4ff; color: var(--primary); }

    /* ── Pagination ── */
    .pagination {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px; border-top: 1px solid var(--border);
      background: var(--card); font-size: 13px; flex-wrap: wrap; gap: 10px;
    }
    .pagination-info { color: var(--text-secondary); }
    .pagination-btns { display: flex; gap: 6px; }
    .page-btn {
      min-width: 32px; height: 32px; border: 1px solid var(--border);
      background: #fff; border-radius: 4px; cursor: pointer; font-size: 13px;
      transition: all .15s; padding: 0 8px;
    }
    .page-btn:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
    .page-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .page-btn:disabled { opacity: .4; cursor: not-allowed; }

    /* ── Empty / Loading ── */
    .empty-row td { text-align: center; padding: 40px; color: var(--text-muted); }
    .loading-row td { text-align: center; padding: 30px; color: var(--text-muted); }

    /* ── Toast ── */
    #toast {
      position: fixed; bottom: 24px; right: 24px; z-index: 9999;
      background: #333; color: #fff; padding: 10px 18px;
      border-radius: var(--radius); font-size: 14px;
      opacity: 0; transform: translateY(8px);
      transition: opacity .25s, transform .25s; pointer-events: none;
    }
    #toast.show { opacity: 1; transform: translateY(0); }
    #toast.success { background: #389e0d; }
    #toast.error   { background: var(--danger); }

    /* ── Confirm modal ── */
    #confirmModal {
      display: none; position: fixed; inset: 0; z-index: 1000;
      background: rgba(0,0,0,.45); align-items: center; justify-content: center;
    }
    #confirmModal.open { display: flex; }
    .modal-box {
      background: var(--card); border-radius: 10px; padding: 28px 30px;
      max-width: 380px; width: 90%; box-shadow: 0 8px 32px rgba(0,0,0,.18);
    }
    .modal-box h3 { margin-bottom: 10px; font-size: 16px; }
    .modal-box p  { color: var(--text-secondary); font-size: 14px; margin-bottom: 20px; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }

    @media (max-width: 600px) {
      .main-content { padding: 14px; }
      .topbar { padding: 0 14px; }
      .preview-cell { max-width: 120px; }
    }
  </style>
</head>
<body>

<!-- 登录页 -->
<div id="loginScreen">
  <div class="login-card">
    <h1>🔐 管理后台</h1>
    <p>TextShare 管理员登录</p>
    <input id="tokenInput" type="password" placeholder="输入管理员令牌" autocomplete="current-password" />
    <button id="loginBtn">登 录</button>
    <p class="note">令牌仅保存在当前页面内存，刷新或关闭页面后需要重新登录。</p>
    <div id="loginError"></div>
  </div>
</div>

<!-- 主界面 -->
<div id="adminApp">
  <div class="topbar">
    <h1>🛡️ TextShare 管理后台</h1>
    <div class="topbar-actions">
      <button class="btn btn-default btn-sm" id="refreshBtn">刷新</button>
      <button class="btn btn-default btn-sm" id="logoutBtn">退出</button>
    </div>
  </div>

  <div class="main-content">
    <!-- 统计卡片 -->
    <div class="stats-grid" id="statsGrid">
      <div class="stat-card"><div class="stat-label">总分享数</div><div class="stat-value" id="statTotal">-</div></div>
      <div class="stat-card"><div class="stat-label">总访问次数</div><div class="stat-value views" id="statViews">-</div></div>
      <div class="stat-card"><div class="stat-label">已过期</div><div class="stat-value expired" id="statExpired">-</div></div>
      <div class="stat-card"><div class="stat-label">永不过期</div><div class="stat-value" id="statNever">-</div></div>
    </div>

    <!-- 工具栏 -->
    <div class="toolbar">
      <input type="search" id="searchInput" placeholder="按 ID 搜索…" />
      <div class="toolbar-right">
        <button class="btn btn-danger btn-sm" id="batchDeleteBtn" disabled>删除所选</button>
        <button class="btn btn-warning btn-sm" id="cleanupBtn">清理过期</button>
      </div>
    </div>

    <!-- 表格 -->
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th><input type="checkbox" id="checkAll" title="全选" /></th>
            <th>ID / 链接</th>
            <th>内容预览</th>
            <th>创建时间</th>
            <th>过期时间</th>
            <th>访问次数</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr class="loading-row"><td colspan="7">加载中…</td></tr>
        </tbody>
      </table>
      <div class="pagination" id="paginationBar">
        <div class="pagination-info" id="pageInfo"></div>
        <div class="pagination-btns" id="pageBtns"></div>
      </div>
    </div>

    <div class="audit-wrap">
      <h2>最近审计日志</h2>
      <table>
        <thead>
          <tr>
            <th>时间</th>
            <th>动作</th>
            <th>目标</th>
            <th>详情</th>
            <th>来源 IP</th>
          </tr>
        </thead>
        <tbody id="auditTableBody">
          <tr class="loading-row"><td colspan="5">加载中…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<!-- 确认弹窗 -->
<div id="confirmModal">
  <div class="modal-box">
    <h3 id="confirmTitle">确认操作</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button class="btn btn-default" id="confirmCancel">取消</button>
      <button class="btn btn-danger" id="confirmOk">确认删除</button>
    </div>
  </div>
</div>

<script>
  // ── State ────────────────────────────────────────────────────────────────
  const state = {
    token: '',
    page: 1,
    limit: 20,
    search: '',
    total: 0,
    selected: new Set(),
    searchTimer: null
  };

  // ── DOM refs ─────────────────────────────────────────────────────────────
  const $ = id => document.getElementById(id);
  const loginScreen  = $('loginScreen');
  const adminApp     = $('adminApp');
  const tokenInput   = $('tokenInput');
  const loginBtn     = $('loginBtn');
  const loginError   = $('loginError');
  const tableBody    = $('tableBody');
  const checkAll     = $('checkAll');
  const batchDeleteBtn = $('batchDeleteBtn');
  const searchInput  = $('searchInput');
  const pageInfo     = $('pageInfo');
  const pageBtns     = $('pageBtns');
  const auditTableBody = $('auditTableBody');
  const toast        = $('toast');
  const confirmModal = $('confirmModal');

  // ── Toast ─────────────────────────────────────────────────────────────────
  let _toastTimer;
  function showToast(msg, type = '') {
    clearTimeout(_toastTimer);
    toast.textContent = msg;
    toast.className = 'show ' + type;
    _toastTimer = setTimeout(() => { toast.className = ''; }, 2800);
  }

  // ── Confirm dialog ────────────────────────────────────────────────────────
  function confirmDialog(title, msg) {
    return new Promise(resolve => {
      $('confirmTitle').textContent = title;
      $('confirmMsg').textContent   = msg;
      confirmModal.classList.add('open');
      const ok     = $('confirmOk');
      const cancel = $('confirmCancel');
      const close  = result => {
        confirmModal.classList.remove('open');
        ok.removeEventListener('click', onOk);
        cancel.removeEventListener('click', onCancel);
        resolve(result);
      };
      const onOk     = () => close(true);
      const onCancel = () => close(false);
      ok.addEventListener('click', onOk);
      cancel.addEventListener('click', onCancel);
    });
  }

  // ── API helper ────────────────────────────────────────────────────────────
  async function api(method, path, body) {
    const opts = {
      method,
      headers: { 'Authorization': 'Bearer ' + state.token }
    };
    if (body !== undefined) {
      opts.headers['Content-Type'] = 'application/json';
      opts.body = JSON.stringify(body);
    }
    const res = await fetch('/api/admin' + path, opts);
    const data = await res.json();
    return { ok: res.ok, status: res.status, data };
  }

  // ── Auth ──────────────────────────────────────────────────────────────────
  async function tryLogin() {
    const token = tokenInput.value.trim();
    if (!token) { loginError.textContent = '请输入令牌'; return; }

    loginError.textContent = '';
    loginBtn.disabled = true;
    loginBtn.textContent = '验证中…';

    // 先写入 state，api() 才能在请求头里带上 token
    state.token = token;

    const { ok, data } = await api('GET', '/stats').catch(() => ({ ok: false, data: {} }));

    loginBtn.disabled = false;
    loginBtn.textContent = '登 录';

    if (!ok) {
      state.token = '';   // 验证失败则清空
      loginError.textContent = data.error || '令牌无效或服务未启用';
      return;
    }

    showMain(data.data);
  }

  function logout() {
    state.token = '';
    adminApp.style.display = 'none';
    loginScreen.style.display = 'flex';
    tokenInput.value = '';
    loginError.textContent = '';
  }

  function showMain(statsData) {
    loginScreen.style.display = 'none';
    adminApp.style.display = 'block';
    renderStats(statsData);
    loadShares();
    loadAuditLogs();
  }

  // ── Stats ─────────────────────────────────────────────────────────────────
  function renderStats(d) {
    if (!d) return;
    $('statTotal').textContent   = d.total   ?? '-';
    $('statViews').textContent   = d.totalViews ?? '-';
    $('statExpired').textContent = d.expired  ?? '-';
    $('statNever').textContent   = d.neverExpire ?? '-';
  }

  async function refreshStats() {
    const { ok, data } = await api('GET', '/stats');
    if (ok) renderStats(data.data);
  }

  async function loadAuditLogs() {
    auditTableBody.innerHTML = '<tr class="loading-row"><td colspan="5">加载中…</td></tr>';
    const { ok, status, data } = await api('GET', '/audit-logs?limit=10');
    if (!ok) {
      if (status === 401) { logout(); return; }
      auditTableBody.innerHTML = `<tr class="empty-row"><td colspan="5">加载失败：${data.error || '未知错误'}</td></tr>`;
      return;
    }

    if (!data.data.rows.length) {
      auditTableBody.innerHTML = '<tr class="empty-row"><td colspan="5">暂无审计记录</td></tr>';
      return;
    }

    auditTableBody.innerHTML = data.data.rows.map(row => `
      <tr class="audit-row">
        <td class="time-cell">${formatTime(row.createdTime)}</td>
        <td>${esc(row.action)}</td>
        <td>${esc(row.target)}</td>
        <td class="audit-detail" title="${esc(JSON.stringify(row.detail || {}))}">${esc(JSON.stringify(row.detail || {}))}</td>
        <td>${esc(row.actorIp || '-')}</td>
      </tr>
    `).join('');
  }

  // ── List ──────────────────────────────────────────────────────────────────
  async function loadShares() {
    tableBody.innerHTML = '<tr class="loading-row"><td colspan="7">加载中…</td></tr>';
    checkAll.checked = false;
    state.selected.clear();
    batchDeleteBtn.disabled = true;

    const qs = `?page=${state.page}&limit=${state.limit}&search=${encodeURIComponent(state.search)}`;
    const { ok, status, data } = await api('GET', '/shares' + qs);

    if (!ok) {
      if (status === 401) { logout(); return; }
      tableBody.innerHTML = `<tr class="empty-row"><td colspan="7">加载失败：${data.error || '未知错误'}</td></tr>`;
      return;
    }

    const { total, rows } = data.data;
    state.total = total;
    renderTable(rows);
    renderPagination(total);
  }

  function formatTime(iso) {
    if (!iso) return '<span class="badge badge-never">永不过期</span>';
    const d = new Date(iso);
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function expireBadge(row) {
    if (!row.expireTime) return '<span class="badge badge-never">永不过期</span>';
    if (row.isExpired)   return '<span class="badge badge-expired">已过期</span>';
    return '<span class="badge badge-active">有效</span>';
  }

  function renderTable(rows) {
    if (!rows.length) {
      tableBody.innerHTML = '<tr class="empty-row"><td colspan="7">暂无数据</td></tr>';
      return;
    }
    tableBody.innerHTML = rows.map(row => `
      <tr data-id="${esc(row.id)}">
        <td><input type="checkbox" class="row-check" data-id="${esc(row.id)}" /></td>
        <td class="id-cell">
          <a href="${esc(row.url)}" target="_blank" rel="noopener">${esc(row.id)}</a>
        </td>
        <td class="preview-cell" title="${esc(row.contentPreview || '')}">${esc(row.contentPreview || '(空)')}</td>
        <td class="time-cell">${formatTime(row.createTime)}</td>
        <td class="time-cell">${row.expireTime ? formatTime(row.expireTime) : ''}
          ${expireBadge(row)}</td>
        <td>${row.viewCount}</td>
        <td>
          <button class="btn btn-danger btn-sm del-btn" data-id="${esc(row.id)}">删除</button>
        </td>
      </tr>
    `).join('');

    // row checkboxes
    tableBody.querySelectorAll('.row-check').forEach(cb => {
      cb.addEventListener('change', onRowCheck);
    });

    // delete buttons
    tableBody.querySelectorAll('.del-btn').forEach(btn => {
      btn.addEventListener('click', () => deleteSingle(btn.dataset.id));
    });
  }

  function esc(s) {
    if (s == null) return '';
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ── Pagination ────────────────────────────────────────────────────────────
  function renderPagination(total) {
    const totalPages = Math.ceil(total / state.limit) || 1;
    const start = (state.page - 1) * state.limit + 1;
    const end   = Math.min(state.page * state.limit, total);
    pageInfo.textContent = total > 0 ? `第 ${start}–${end} 条，共 ${total} 条` : '共 0 条';

    let html = '';
    html += `<button class="page-btn" id="prevPage" ${state.page <= 1 ? 'disabled' : ''}>‹ 上一页</button>`;

    const maxVisible = 5;
    let startP = Math.max(1, state.page - Math.floor(maxVisible / 2));
    let endP   = Math.min(totalPages, startP + maxVisible - 1);
    if (endP - startP < maxVisible - 1) startP = Math.max(1, endP - maxVisible + 1);

    for (let p = startP; p <= endP; p++) {
      html += `<button class="page-btn ${p === state.page ? 'active' : ''}" data-page="${p}">${p}</button>`;
    }
    html += `<button class="page-btn" id="nextPage" ${state.page >= totalPages ? 'disabled' : ''}>下一页 ›</button>`;
    pageBtns.innerHTML = html;

    pageBtns.querySelectorAll('[data-page]').forEach(btn => {
      btn.addEventListener('click', () => { state.page = +btn.dataset.page; loadShares(); });
    });
    const prev = $('prevPage');
    const next = $('nextPage');
    if (prev) prev.addEventListener('click', () => { state.page--; loadShares(); });
    if (next) next.addEventListener('click', () => { state.page++; loadShares(); });
  }

  // ── Select / Batch ────────────────────────────────────────────────────────
  function onRowCheck(e) {
    const id = e.target.dataset.id;
    if (e.target.checked) state.selected.add(id);
    else state.selected.delete(id);
    batchDeleteBtn.disabled = state.selected.size === 0;

    const allChecks = tableBody.querySelectorAll('.row-check');
    checkAll.checked  = allChecks.length > 0 && [...allChecks].every(c => c.checked);
    checkAll.indeterminate = !checkAll.checked && state.selected.size > 0;
  }

  checkAll.addEventListener('change', () => {
    const checked = checkAll.checked;
    tableBody.querySelectorAll('.row-check').forEach(cb => {
      cb.checked = checked;
      if (checked) state.selected.add(cb.dataset.id);
      else state.selected.delete(cb.dataset.id);
    });
    batchDeleteBtn.disabled = state.selected.size === 0;
  });

  // ── Delete ────────────────────────────────────────────────────────────────
  async function deleteSingle(id) {
    const ok = await confirmDialog('删除确认', `确定要删除 ID 为「${id}」的分享吗？此操作不可撤销。`);
    if (!ok) return;

    const res = await api('DELETE', `/shares/${id}`);
    if (res.ok) {
      showToast('删除成功', 'success');
      state.selected.delete(id);
      await loadShares();
      await refreshStats();
      await loadAuditLogs();
    } else {
      showToast(res.data.error || '删除失败', 'error');
    }
  }

  batchDeleteBtn.addEventListener('click', async () => {
    const ids = [...state.selected];
    const ok = await confirmDialog('批量删除确认', `确定要删除选中的 ${ids.length} 条记录吗？此操作不可撤销。`);
    if (!ok) return;

    const res = await api('DELETE', '/shares', { ids });
    if (res.ok) {
      showToast(`已删除 ${res.data.data.deleted} 条记录`, 'success');
      state.selected.clear();
      await loadShares();
      await refreshStats();
      await loadAuditLogs();
    } else {
      showToast(res.data.error || '批量删除失败', 'error');
    }
  });

  // ── Cleanup ───────────────────────────────────────────────────────────────
  $('cleanupBtn').addEventListener('click', async () => {
    const ok = await confirmDialog('清理过期记录', '将删除所有已过期的分享记录，此操作不可撤销。');
    if (!ok) return;

    const res = await api('POST', '/cleanup');
    if (res.ok) {
      showToast(`已清理 ${res.data.data.deleted} 条过期记录`, 'success');
      await loadShares();
      await refreshStats();
      await loadAuditLogs();
    } else {
      showToast(res.data.error || '清理失败', 'error');
    }
  });

  // ── Search ────────────────────────────────────────────────────────────────
  searchInput.addEventListener('input', () => {
    clearTimeout(state.searchTimer);
    state.searchTimer = setTimeout(() => {
      state.search = searchInput.value.trim();
      state.page   = 1;
      loadShares();
    }, 400);
  });

  // ── Misc ──────────────────────────────────────────────────────────────────
  $('refreshBtn').addEventListener('click', () => { loadShares(); refreshStats(); loadAuditLogs(); });
  $('logoutBtn').addEventListener('click', logout);
  loginBtn.addEventListener('click', tryLogin);
  tokenInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });
  confirmModal.addEventListener('click', e => {
    if (e.target === confirmModal) confirmModal.classList.remove('open');
  });

  // ── Init ──────────────────────────────────────────────────────────────────
  loginScreen.style.display = 'flex';
</script>
</body>
</html>
